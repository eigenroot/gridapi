# Local PostgreSQL for development: `docker compose up -d`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: grid_api
      POSTGRES_USER: grid
      POSTGRES_PASSWORD: grid
    ports:
      - "5432:5432"
    volumes:
      - grid-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grid -d grid_api"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  grid-postgres:
